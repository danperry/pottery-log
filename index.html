<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pottery Log</title>
  <meta name="description" content="Log your pottery pieces from greenware to done.">
  <meta name="theme-color" content="#a4552f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <h1 id="pageTitle">Pottery Log</h1>
    <button class="icon-btn" id="backupNavBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
    </button>
  </header>

  <div class="conn-bar" id="reconnectBar" role="alert" hidden>
    <span>Google Drive got disconnected. Your pieces are safe on this device.</span>
    <button type="button" class="btn btn-small" id="reconnectBarBtn">Reconnect</button>
  </div>

  <div class="offline-note" id="offlineNote" role="status" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.5-1.8M1.4 9a16 16 0 0 1 4.5-2.9M22.6 9A16 16 0 0 0 11 4.6M12 20h.01"/></svg>
    <span id="offlineNoteText">You're offline. Everything is saved on this device.</span>
  </div>

  <main id="app" tabindex="-1"></main>

  <button class="fab" id="addBtn" aria-label="Add piece">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Templates -->
  <template id="tpl-list">
    <section class="list-view">
      <div class="install-tip" id="connectTip" role="note" hidden></div>
      <div class="install-tip" id="installTip" role="note" hidden></div>
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Search title, clay, glaze, notes…" aria-label="Search pieces">
        <button type="button" class="icon-btn filter-btn" id="filterBtn" aria-label="Choose filters" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" /></svg>
          <span class="badge" id="filterBadge" hidden></span>
        </button>
      </div>
      <div class="chips" id="stageFilter" role="tablist" aria-label="Filter by stage"></div>
      <div class="field-filters" id="fieldFilters" hidden></div>
      <dialog class="sheet" id="filterDialog" aria-labelledby="filterDialogTitle">
        <form method="dialog">
          <h2 id="filterDialogTitle">Filters on the home screen</h2>
          <p class="muted small">Choose which fields to filter by. Your choice syncs to your other devices.</p>
          <div class="check-list" id="filterChoices"></div>
          <p class="muted small" id="filterNoCustom">Add your own fields under <a href="#/backup">Settings → Custom fields</a>.</p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" value="done">Done</button>
          </div>
        </form>
      </dialog>
      <p class="count" id="countLabel"></p>
      <ul class="cards" id="cardList"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-pot" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M22 10h20M24 10c0 6-10 10-10 24 0 12 8 20 18 20s18-8 18-20c0-14-10-18-10-24" /></svg>
        </div>
        <h2>No pieces yet</h2>
        <p>Tap <strong>+</strong> to log your first piece.</p>
      </div>
    </section>
  </template>

  <template id="tpl-detail">
    <article class="detail-view">
      <div class="gallery-wrap">
        <div class="gallery" id="gallery"></div>
        <button type="button" class="gallery-nav prev" id="galleryPrev" aria-label="Previous photo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="gallery-nav next" id="galleryNext" aria-label="Next photo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="gallery-add" id="galleryAdd" hidden>
        <label class="btn btn-secondary btn-small">
          <input type="file" accept="image/*" multiple id="detailPhotoInput" hidden>
          Add photos
        </label>
      </div>
      <div class="detail-body">
        <div class="detail-head">
          <h2 id="dTitle"></h2>
          <span class="stage-pill" id="dStage"></span>
        </div>
        <ol class="stage-track" id="dTrack" aria-label="Stage progress"></ol>
        <button class="btn btn-secondary btn-small" id="advanceBtn" hidden></button>
        <dl class="facts" id="dFacts"></dl>
        <div id="dNotesWrap" hidden>
          <h3>Notes</h3>
          <p class="notes" id="dNotes"></p>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" id="editBtn">Edit</button>
          <button class="btn btn-danger-ghost" id="deleteBtn">Delete</button>
        </div>
      </div>
    </article>
  </template>

  <template id="tpl-edit">
    <form class="edit-view" id="editForm" novalidate>
      <label class="field">
        <span>Title</span>
        <input name="title" required maxlength="120" placeholder="e.g. Tall speckled mug" autocomplete="off">
      </label>

      <div class="field">
        <span>Photos</span>
        <div class="photo-grid" id="photoGrid"></div>
        <label class="btn btn-secondary btn-small photo-add">
          <input type="file" accept="image/*" multiple id="photoInput" hidden>
          Add photos
        </label>
      </div>

      <div class="field">
        <span id="clayLabel">Clay bodies</span>
        <div class="tag-picker" id="clayPicker" aria-labelledby="clayLabel"></div>
      </div>

      <fieldset class="field">
        <legend>Forming method</legend>
        <div class="segmented">
          <label><input type="radio" name="method" value="wheel"><span>Wheel</span></label>
          <label><input type="radio" name="method" value="hand-built"><span>Hand-built</span></label>
        </div>
      </fieldset>

      <section class="form-section" aria-labelledby="bisqueHead">
        <h3 id="bisqueHead">Bisque</h3>
        <div class="field-row">
          <label class="field">
            <span>Firing type</span>
            <select name="bisqueFiringType"><option value="">—</option></select>
          </label>
          <label class="field">
            <span>Cone</span>
            <select name="bisqueCone"><option value="">—</option></select>
          </label>
        </div>
      </section>

      <section class="form-section" aria-labelledby="glazeHead">
        <h3 id="glazeHead">Glaze</h3>
        <div class="field">
          <span id="glazeLabel">Glazes</span>
          <div class="tag-picker" id="glazePicker" aria-labelledby="glazeLabel"></div>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Firing type</span>
            <select name="glazeFiringType"><option value="">—</option></select>
          </label>
          <label class="field">
            <span>Cone</span>
            <select name="glazeCone"><option value="">—</option></select>
          </label>
        </div>
      </section>

      <fieldset class="field">
        <legend>Stage</legend>
        <div class="segmented segmented-4" id="stageSeg"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Dates</legend>
        <div class="dates-grid">
          <label><span>Made</span><input type="date" name="dateMade"></label>
          <label><span>Bisque fired</span><input type="date" name="dateBisque"></label>
          <label><span>Glaze fired</span><input type="date" name="dateGlazed"></label>
          <label><span>Finished</span><input type="date" name="dateDone"></label>
        </div>
      </fieldset>

      <div class="custom-fields" id="customFields"></div>

      <label class="field">
        <span>Notes</span>
        <textarea name="notes" rows="5" placeholder="Dimensions, glaze application, results, what to try next…"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </template>

  <template id="tpl-backup">
    <section class="backup-view">
      <div class="panel">
        <h2>Google Drive sync</h2>
        <p class="muted">Pieces are saved on this device. Connect your own Google Drive to keep them safe and in step across your devices. Each piece gets its own folder with its photos and a readable <code>piece.json</code>, so you can browse them in Drive without the app. The app can only see files it created.</p>
        <div id="driveUnconfigured" hidden>
          <p class="warn">Google sign-in isn't set up yet. Deploy the sign-in Worker and add its URL to <code>js/config.js</code> (see the README).</p>
        </div>
        <div id="driveSignedOut" hidden>
          <p class="warn" id="reconnectNote" hidden>Google Drive was disconnected, either because access was removed or because it went unused for 6 months. Your pieces are safe on this device. Reconnect to keep syncing.</p>
          <button class="btn btn-google" id="signInBtn">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4-13.6-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
            <span id="signInLabel">Sign in with Google</span>
          </button>
        </div>
        <div id="driveSignedIn" hidden>
          <p class="account" id="accountLabel"></p>
          <div class="folder-box">
            <div class="folder-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
              <div class="folder-text">
                <span class="muted small">Drive folder</span>
                <strong id="folderLabel">Not chosen yet</strong>
              </div>
            </div>
            <div class="folder-actions">
              <button class="btn btn-secondary btn-small" id="pickFolderBtn">Choose folder</button>
              <button class="btn btn-ghost btn-small" id="newFolderBtn">New folder</button>
            </div>
            <div id="foundFolders" hidden>
              <p class="muted small">Pottery Log folders already in your Drive:</p>
              <div class="folder-actions" id="foundFolderBtns"></div>
            </div>
            <p class="muted small" id="pickerHint" hidden>If Google's folder picker showed an error such as "The API developer key is invalid", this browser is blocking it. Some browsers, such as Comet, do. Use <strong>New folder</strong>, or choose the folder once in Chrome; after that it's listed here on every browser.</p>
            <form class="new-folder" id="newFolderForm" hidden>
              <label class="field">
                <span>New folder name</span>
                <input id="newFolderName" maxlength="120" value="Pottery Log" autocomplete="off">
              </label>
              <p class="muted small" id="newFolderWhere">It will be created at the top of My Drive.</p>
              <div class="folder-actions">
                <button type="submit" class="btn btn-primary btn-small">Create</button>
                <button type="button" class="btn btn-ghost btn-small" id="newFolderCancel">Cancel</button>
              </div>
            </form>
          </div>
          <p class="muted small">Syncs automatically when the app opens and every time you save.</p>
          <p class="muted small" id="lastSyncLabel"></p>
          <div class="progress" id="driveProgress" hidden><div class="progress-bar" id="driveProgressBar"></div><span id="driveProgressText"></span></div>
          <div class="btn-col">
            <button class="btn btn-primary" id="syncBtn">Sync now</button>
            <button class="btn btn-ghost" id="signOutBtn">Disconnect</button>
          </div>
        </div>
      </div>

      <div class="panel" id="listsPanel">
        <h2>Glazes and clays</h2>
        <p class="muted">These fill the drop-downs when you edit a piece. New ones you type on a piece are remembered here automatically, and the lists sync with your other devices.</p>
        <h3 class="list-head">Clay bodies</h3>
        <ul class="cf-list" id="clayListEdit"></ul>
        <form class="list-add" id="clayAddForm">
          <input id="clayAddName" maxlength="120" placeholder="Add a clay body" autocomplete="off" aria-label="Clay body name">
          <button type="submit" class="btn btn-secondary btn-small">Add</button>
        </form>
        <h3 class="list-head">Glazes</h3>
        <ul class="cf-list" id="glazeListEdit"></ul>
        <form class="list-add" id="glazeAddForm">
          <input id="glazeAddName" maxlength="120" placeholder="Add a glaze" autocomplete="off" aria-label="Glaze name">
          <button type="submit" class="btn btn-secondary btn-small">Add</button>
        </form>
      </div>

      <div class="panel" id="customFieldsPanel">
        <h2>Custom fields</h2>
        <p class="muted">Add your own fields to every piece, such as kiln, weight, price or who it's for. Text fields can remember the values you type and offer them in a drop-down. Tap the pencil to rename a field, change its type or edit its list. They sync with your other devices and appear in each piece's <code>piece.json</code>.</p>
        <ul class="cf-list" id="cfList"></ul>
        <form class="cf-add" id="cfAddForm">
          <div class="field-row">
            <label class="field">
              <span>Field name</span>
              <input id="cfName" maxlength="60" placeholder="e.g. Kiln" autocomplete="off">
            </label>
            <label class="field">
              <span>Type</span>
              <select id="cfType"></select>
            </label>
          </div>
          <div class="field" id="cfRememberRow">
            <label class="yesno"><input type="checkbox" id="cfRemember" checked><b>Remember values for a drop-down, like glazes</b></label>
          </div>
          <label class="field" id="cfOptionsRow" hidden>
            <span>Choices, separated by commas</span>
            <input id="cfOptions" maxlength="500" placeholder="e.g. Big kiln, Test kiln, Studio" autocomplete="off">
          </label>
          <button type="submit" class="btn btn-secondary btn-small">Add field</button>
        </form>
      </div>

      <div class="panel">
        <h2>On this device</h2>
        <p class="muted" id="localStats"></p>
        <p class="muted small" id="persistLabel"></p>
      </div>

      <p class="muted small center">Pottery Log · data stays on your device and in your Drive · <a href="privacy.html">Privacy policy</a></p>
    </section>
  </template>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
